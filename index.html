<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>somewhere-now — 地球のライブカメラを地図から覗く</title>
    <meta
      name="description"
      content="世界のYouTubeライブカメラ5,711地点を地図と地球儀から覗く。昼夜の境界を描き、いま夜の場所・昼の場所を選べます。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The first thing visible is the map tiles (this is the LCP element). The request
         does not start until JS evaluation finishes, so open just the connection meanwhile. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <!-- Shaded-relief tiles and country-name glyphs for the globe. preconnect would take
         bandwidth from the flat map's LCP, so only name resolution here. -->
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <!-- The first visible tiles become the LCP element. The request does not start until
         JS evaluation finishes, so fetch them in parallel from the HTML (measured LCP 3.3→2.8s).
         The source of truth for the initial view is INITIAL_VIEW in src/domain/mapView.ts;
         if it disagrees with this, mapView.test.ts fails. -->
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/1/1.png" crossorigin />
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/2/1.png" crossorigin />
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/1/0.png" crossorigin />
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/2/0.png" crossorigin />
    <!-- Fonts use font-display: swap, so they do not block rendering. Their file names carry
         a content hash and cannot be pinned, which is another reason not to preload. -->
    <!-- The image shown when the page is shared. The artwork is scripts/og-card.html.
         Some crawlers only pick up absolute URLs, so the domain is hard-coded only here. -->
    <meta property="og:title" content="somewhere-now — 地球のライブカメラを地図から覗く" />
    <meta property="og:description" content="世界のYouTubeライブカメラ5,711地点を地図と地球儀から覗く。昼夜の境界を描き、いま夜の場所・昼の場所を選べます。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Somewhere Now" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://somewhere-now.saitotakuya0719.workers.dev/" />
    <meta property="og:image" content="https://somewhere-now.saitotakuya0719.workers.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="夜側に琥珀の灯がともる地球儀と、Somewhere Now の文字" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="somewhere-now — 地球のライブカメラを地図から覗く" />
    <meta name="twitter:description" content="世界のYouTubeライブカメラ5,711地点を地図と地球儀から。昼夜の境界つき。" />
    <meta name="twitter:image" content="https://somewhere-now.saitotakuya0719.workers.dev/og.png" />
    <link rel="canonical" href="https://somewhere-now.saitotakuya0719.workers.dev/" />
    <meta name="theme-color" content="#0B1620" />
  </head>
  <body>
    <div class="app" id="app" data-mode="map">
      <header class="masthead">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Somewhere Now</span>
        </a>
        <div class="masthead__controls" id="controls"></div>
      </header>

      <main class="stage">
        <div class="map" id="map"></div>
        <div class="globe" id="globe" aria-label="地球儀"></div>
        <section class="wall" id="wall" hidden aria-label="並べて見る"></section>
        <section class="watching" id="watching" hidden aria-label="視聴が多い順"></section>
        <aside class="notes" id="notes">
          <div class="dial" id="dial" aria-live="polite"></div>
          <div class="legend" id="legend"></div>
        </aside>
      </main>

      <aside class="panel" id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
