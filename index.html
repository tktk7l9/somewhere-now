<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>somewhere-now — 地球のライブカメラを地図から覗く</title>
    <meta
      name="description"
      content="世界のYouTubeライブカメラ5,720地点を地図と地球儀から覗く。昼夜の境界を描き、いま夜の場所・昼の場所を選べます。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 最初に見えるのは地図のタイル(LCP 要素がこれ)。JS の評価が終わるまで
         リクエストが始まらないので、その間に接続だけ張っておく。 -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <!-- 地球儀の陰影タイルと国名グリフ。preconnect は平面図の LCP と帯域を
         奪うので、ここでは名前解決だけ。 -->
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <!-- 最初に見えるタイルが LCP 要素になる。JS の評価が終わるまでリクエストが
         始まらないので、HTML の時点で並行して取りに行かせる(実測 LCP 3.3→2.8s)。
         初期表示は src/domain/mapView.ts の INITIAL_VIEW が正本で、ここと
         食い違うと mapView.test.ts が落ちる。 -->
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/1/1.png" crossorigin />
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/2/1.png" crossorigin />
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/1/0.png" crossorigin />
    <link rel="preload" as="image" href="https://tile.openstreetmap.org/2/2/0.png" crossorigin />
    <!-- 書体は font-display: swap なので描画を止めない。ファイル名が内容ハッシュ
         付きで固定できないこともあり、preload はしない。 -->
    <!-- 共有されたときに出る一枚。版下は scripts/og-card.html。
         絶対 URL でないと拾わないクローラがいるので、ここだけドメインを直書きする。 -->
    <meta property="og:title" content="somewhere-now — 地球のライブカメラを地図から覗く" />
    <meta property="og:description" content="世界のYouTubeライブカメラ5,720地点を地図と地球儀から覗く。昼夜の境界を描き、いま夜の場所・昼の場所を選べます。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Somewhere Now" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://somewhere-now.saitotakuya0719.workers.dev/" />
    <meta property="og:image" content="https://somewhere-now.saitotakuya0719.workers.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="夜側に琥珀の灯がともる地球儀と、Somewhere Now の文字" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="somewhere-now — 地球のライブカメラを地図から覗く" />
    <meta name="twitter:description" content="世界のYouTubeライブカメラ5,720地点を地図と地球儀から。昼夜の境界つき。" />
    <meta name="twitter:image" content="https://somewhere-now.saitotakuya0719.workers.dev/og.png" />
    <link rel="canonical" href="https://somewhere-now.saitotakuya0719.workers.dev/" />
    <meta name="theme-color" content="#0B1620" />
  </head>
  <body>
    <div class="app" id="app" data-mode="map">
      <header class="masthead">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Somewhere Now</span>
        </a>
        <div class="masthead__controls" id="controls"></div>
      </header>

      <main class="stage">
        <div class="map" id="map"></div>
        <div class="globe" id="globe" aria-label="Globe"></div>
        <section class="wall" id="wall" hidden aria-label="Video wall"></section>
        <section class="watching" id="watching" hidden aria-label="視聴が多い順"></section>
        <section class="break" id="break" hidden aria-label="Break"></section>
        <aside class="notes" id="notes">
          <div class="dial" id="dial" aria-live="polite"></div>
          <div class="legend" id="legend"></div>
        </aside>
      </main>

      <aside class="panel" id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
