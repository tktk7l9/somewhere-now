# gitleaks config. Uses the default rule set as is and only removes false positives.
#
# titleKey in the camera master is "a keyword for telling YouTube stream titles apart",
# which is the public stream name itself. It is not a secret. But generic-api-key mistakes
# titles made of consecutive alphanumerics without symbols, such as "BerlinWebcam1", for a key.
# There are 5,720 camera locations and the number will grow, so instead of adding
# fingerprints one by one, the titleKey line itself is excluded.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "カメラマスタ/収集スクリプトの titleKey（公開されている配信タイトル）"
regexTarget = "line"
regexes = ['''titleKey:\s*"''']
